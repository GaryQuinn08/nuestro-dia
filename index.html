<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Zona Geek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Nuestra Zona Geek</h1>
      <p>Catálogo y seguimiento compartido</p>
    </header>

    <main>
      <!-- Formulario para agregar elementos -->
      <section class="card">
        <h2>Añadir a la lista</h2>
        <form id="item-form">
          <div class="input-wrapper">
            <label class="cap" for="w-title">Título (escribe para autocompletar)</label>
            <input id="w-title" type="text" required maxlength="80" placeholder="Ej. D.Gray-man, Chainsaw Man…">
            <div id="autocomplete-list" class="autocomplete-dropdown" hidden></div>
          </div>

          <div class="input-wrapper">
            <label class="cap" for="w-kind">Tipo</label>
            <select id="w-kind">
              <option value="anime">Anime</option>
              <option value="serie">Serie / Película</option>
            </select>
          </div>

          <div id="detected-plats-box" hidden>
            <span class="cap">Plataformas sugeridas (haz clic para elegir o buscar):</span>
            <div id="detected-plats" class="chips-container"></div>
          </div>

          <div class="input-wrapper">
            <label class="cap" for="w-plat">Plataforma seleccionada</label>
            <input id="w-plat" type="text" placeholder="Ej. Crunchyroll, JKanime...">
          </div>

          <button type="submit" class="btn-primary">Guardar en el Catálogo</button>
        </form>
      </section>

      <!-- Listado del catálogo -->
      <section class="card">
        <h2>Catálogo Actual</h2>
        <div id="catalog-list" class="api-results"></div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
